set_timer:
  name: Fan software timer
  description: Turn off this fan after a delay. Zero cancels. Restores after Home Assistant restarts. RF state remains assumed.
  target:
    entity:
      integration: rf_fan
      domain: fan
  fields:
    minutes:
      name: Minutes
      required: true
      selector:
        number:
          min: 0
          step: 0.1
          mode: box
safe_off:
  name: Safe OFF
  description: Send Speed 1, wait about one second, then send the configured power/off command. State remains assumed.
  target:
    entity:
      integration: rf_fan
      domain: fan
send_command:
  name: Send configured RF command
  description: Send an existing learned command without changing or relearning it.
  target:
    entity:
      integration: rf_fan
      domain: fan
  fields:
    command:
      name: Command key
      required: true
      selector:
        text:
set_light_cycle:
  name: Set light colour by toggle count
  description: Starting with the light physically off, replay its existing toggle command the configured number of times for the selected colour. RF state remains assumed.
  target:
    entity:
      integration: rf_fan
      domain: fan
  fields:
    mode:
      name: Colour preset
      required: true
      selector:
        select:
          options: ["cool", "neutral", "warm"]
set_assumed_state:
  name: Correct fan assumed state
  description: Correct the displayed state without sending RF.
  target:
    entity:
      integration: rf_fan
      domain: fan
  fields:
    state:
      required: true
      selector:
        select:
          options: ["on", "off", "unknown"]
    percentage:
      selector:
        number:
          min: 0
          max: 100
    direction:
      selector:
        select:
          options: ["forward", "reverse", "unknown"]
set_light_assumed_state:
  name: Correct light assumed state
  description: Correct the displayed light state without sending RF.
  target:
    entity:
      integration: rf_fan
      domain: light
  fields:
    state:
      required: true
      selector:
        select:
          options: ["on", "off", "unknown"]
